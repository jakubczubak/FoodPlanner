            renderPlannerTable();
            savePlan();
        }

        // PRZEPISY
        function renderRecipes(filter = 'all') {
            currentRecipeFilter = filter;
            const grid = document.getElementById('recipes-grid');
            grid.innerHTML = '';

            // Dla nowych filtrów przeszukuj wszystkie typy posiłków
            const specialFilters = ['all', 'favorites', 'oven', 'chicken', 'pasta', 'asian', 'mexican',
                'eggs', 'sandwiches', 'dairy', 'pancakes', 'oatmeal', 'meat', 'pizza', 'soups', 'salads', 'fish', 'casseroles', 'shakes'];
            const types = specialFilters.includes(filter) ? mealTypes : [filter];

            // Mapowanie filtrów na kategorie
            const categoryFilters = {
                eggs: 'Jajka',
                sandwiches: 'Kanapki',
                dairy: 'Nabiał',
                pancakes: 'Naleśniki',
                oatmeal: 'Owsianki',
                chicken: 'Kurczak',
                meat: 'Wołowina/Wieprzowina',
                pasta: 'Makarony',
                asian: 'Ryż/Azja',
                pizza: 'Pizza/Kebab',
                mexican: 'Meksykańskie',
                soups: 'Zupy',
                salads: 'Sałatki',
                fish: 'Ryby',
                casseroles: 'Zapiekanki',
                shakes: "Shake'i"
            };

            let hasRecipes = false;

            types.forEach(mt => {
                recipes[mt].forEach(r => {
                    // Jeśli filtrujemy ulubione, pomiń nie-ulubione
                    if (filter === 'favorites' && !favoriteRecipes.has(r.id)) {
                        return;
                    }

                    // NOWE: Filtr "z piekarnika" - szuka w steps
                    if (filter === 'oven') {
                        const hasOven = r.steps.some(step =>
                            step.toLowerCase().includes('piekarnik')
                        );
                        if (!hasOven) return;
                    }

                    // Filtry po kategorii (uniwersalne)
                    if (categoryFilters[filter] && !r.category.includes(categoryFilters[filter])) {
                        return;
                    }

                    // Filtrowanie po wyszukiwanym tekście (nazwa, składniki, zamienniki i instrukcje)
                    if (currentSearchTerm) {
                        const termLower = currentSearchTerm;
                        const matchesName = r.name.toLowerCase().includes(termLower);
                        const matchesIngredient = r.ingredients.some(ing =>
                            ing.item.toLowerCase().includes(termLower)
                        );
                        const matchesSubstitute = r.ingredients.some(ing =>
                            ing.substitutes && ing.substitutes.some(sub =>
                                sub.item.toLowerCase().includes(termLower)
                            )
                        );
                        const matchesSteps = r.steps.some(step =>
                            step.toLowerCase().includes(termLower)
                        );
                        if (!matchesName && !matchesIngredient && !matchesSubstitute && !matchesSteps) return;
                    }

                    hasRecipes = true;
                    const isFav = favoriteRecipes.has(r.id);
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.onclick = () => openRecipeModal(mt, r);
                    card.innerHTML = `
                        <div class="recipe-header ${mt}">
                            <button class="favorite-btn ${isFav ? 'active' : ''}"
                                onclick="toggleFavorite('${r.id}', event)"
                                title="${isFav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych'}">
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                            <div class="recipe-type">${mealNames[mt]}</div>
                            <div class="recipe-name">${r.name}</div>
                        </div>
                        <div class="recipe-body">
                            <div class="recipe-macros">
                                <div class="macro"><strong>${r.kcal}</strong> kcal</div>
                                <div class="macro"><strong>${r.protein}g</strong> B</div>
                                <div class="macro"><strong>${r.carbs}g</strong> W</div>
                            </div>
                            <div class="recipe-preview">${r.ingredients.slice(0,3).map(x=>x.item).join(', ')}...</div>
                        </div>`;
                    grid.appendChild(card);
                });
            });

            // Pokaż komunikat gdy brak ulubionych
            if (filter === 'favorites' && !hasRecipes) {
                grid.innerHTML = `
                    <div class="no-favorites">
                        <div class="no-favorites-icon">🤍</div>
                        <div class="no-favorites-text">Nie masz jeszcze ulubionych przepisów</div>
                        <div class="no-favorites-hint">Kliknij serduszko na karcie przepisu, aby dodać go do ulubionych</div>
                    </div>`;
            }

            // Pokaż komunikat gdy brak wyników wyszukiwania
            if (currentSearchTerm && !hasRecipes) {
                grid.innerHTML = `
                    <div class="no-results">
                        <p>Nie znaleziono przepisów dla "<strong>${currentSearchTerm}</strong>"</p>
                        <button onclick="clearSearch()">Wyczyść wyszukiwanie</button>
                    </div>`;
            }
        }

        function filterRecipes(f, btn) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderRecipes(f);
        }

        // Funkcja podglądu przepisu z planera
        function previewRecipe(mealType, recipeId) {
            if (!recipeId) return;
            const recipe = recipes[mealType].find(r => r.id === recipeId);
            if (recipe) {
                openRecipeModal(mealType, recipe);
            }
        }

        // Aktualnie wyświetlany przepis i wybrane osoby
        let currentModalRecipe = null;
        let modalSelectedPersons = [1]; // Domyślnie tylko "Ja"
        let modalSplitMode = 'normal'; // 'normal', '5050-person1', '5050-person2'
        let modalPortions = 1; // Liczba porcji wybrana przez użytkownika

        function openRecipeModal(mt, r) {
            currentModalRecipe = r;
            modalSelectedPersons = [1]; // Reset do "tylko ja"
            modalSplitMode = 'normal'; // Reset trybu
            modalPortions = 1; // Reset porcji do 1

            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-header').className = 'modal-header ' + mt;
            document.getElementById('modal-type').textContent = mealNames[mt];
            document.getElementById('modal-name').textContent = r.name;

            // Renderuj przełącznik osób
            renderModalPersonsToggle();

            // Renderuj resztę (makra, składniki)
            updateModalContent();

            document.getElementById('modal-steps').innerHTML = r.steps.map(s => `<li>${s}</li>`).join('');
            document.body.style.overflow = 'hidden';
        }

        function renderModalPersonsToggle() {
            const toggle = document.getElementById('modal-persons-toggle');
            const p1 = persons[0];
            const p2 = persons[1];

            toggle.innerHTML = `
                <button class="modal-person-btn blue ${modalSplitMode === 'normal' && modalSelectedPersons.length === 1 && modalSelectedPersons[0] === 1 ? 'active' : ''}"
                    onclick="setModalPersons([1], 'normal')">
                    <span class="modal-person-dot" style="background: ${p1.color}"></span>
                    ${p1.name}
                </button>
                <button class="modal-person-btn pink ${modalSplitMode === 'normal' && modalSelectedPersons.length === 1 && modalSelectedPersons[0] === 2 ? 'active' : ''}"
                    onclick="setModalPersons([2], 'normal')">
                    <span class="modal-person-dot" style="background: ${p2.color}"></span>
                    ${p2.name}
                </button>
                <button class="modal-person-btn both ${modalSplitMode === 'normal' && modalSelectedPersons.length === 2 ? 'active' : ''}"
                    onclick="setModalPersons([1, 2], 'normal')">
                    <span class="modal-person-dot" style="background: ${p1.color}"></span>
                    <span class="modal-person-dot" style="background: ${p2.color}"></span>
                    Razem
                </button>
                <div class="modal-5050-dropdown">
                    <button class="modal-person-btn split ${modalSplitMode.startsWith('5050') ? 'active' : ''}"
                        onclick="toggle5050Menu(event)">
                        50/50 ▼
                    </button>
                    <div class="modal-5050-menu" id="modal-5050-menu">
                        <button onclick="setModalPersons([1, 2], '5050-person1')">
                            <span class="modal-person-dot" style="background: ${p1.color}"></span>
                            wg ${p1.name} (${p1.portion}x)
                        </button>
                        <button onclick="setModalPersons([1, 2], '5050-person2')">
                            <span class="modal-person-dot" style="background: ${p2.color}"></span>
                            wg ${p2.name} (${p2.portion}x)
                        </button>
                    </div>
                </div>
            `;
        }

        function toggle5050Menu(event) {
            event.stopPropagation();
            const menu = document.getElementById('modal-5050-menu');
            menu.classList.toggle('show');
        }

        // Zamknij menu 50/50 po kliknięciu gdziekolwiek
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('modal-5050-menu');
            if (menu && !e.target.closest('.modal-5050-dropdown')) {
                menu.classList.remove('show');
            }
        });

        function setModalPersons(personIds, mode = 'normal') {
            modalSelectedPersons = personIds;
            modalSplitMode = mode;
            // Zamknij menu 50/50
            const menu = document.getElementById('modal-5050-menu');
            if (menu) menu.classList.remove('show');
            renderModalPersonsToggle();
            updateModalContent();
        }

        function changePortions(delta) {
            modalPortions = Math.max(1, modalPortions + delta);
            updateModalContent();
        }

        function updateModalContent() {
            const r = currentModalRecipe;
            if (!r) return;

            // Renderuj kontrolkę porcji
            document.getElementById('modal-portions-control').innerHTML = `
                <div class="portions-selector">
                    <span class="portions-label">🍽️ Porcji:</span>
                    <button class="portions-btn" onclick="changePortions(-1)" ${modalPortions <= 1 ? 'disabled' : ''}>−</button>
                    <span class="portions-value">${modalPortions}</span>
                    <button class="portions-btn" onclick="changePortions(1)">+</button>
                </div>
            `;

            const p1 = persons[0];
            const p2 = persons[1];
            let multiplier = 0;
            let splitInfo = '';
            let portionPerPerson = 0; // Porcja na osobę przy 50/50

            // Oblicz mnożnik w zależności od trybu
            if (modalSplitMode === '5050-person1') {
                // 50/50 wg osoby 1 (większej porcji)
                multiplier = p1.portion * 2;
                portionPerPerson = p1.portion;
                const kcalPerPerson = Math.round(r.kcal * p1.portion);
                const diff = Math.round(r.kcal * p1.portion - r.kcal * p2.portion);
                splitInfo = `<div class="split-info">
                    <strong>Tryb 50/50</strong> (wg ${p1.name})<br>
                    Łącznie: ${multiplier.toFixed(2)}x → dzielisz na pół<br>
                    <span class="split-warning">⚠️ ${p2.name}: +${diff} kcal nadwyżki</span>
                </div>`;
            } else if (modalSplitMode === '5050-person2') {
                // 50/50 wg osoby 2 (mniejszej porcji)
                multiplier = p2.portion * 2;
                portionPerPerson = p2.portion;
                const diff = Math.round(r.kcal * p1.portion - r.kcal * p2.portion);
                splitInfo = `<div class="split-info">
                    <strong>Tryb 50/50</strong> (wg ${p2.name})<br>
                    Łącznie: ${multiplier.toFixed(2)}x → dzielisz na pół<br>
                    <span class="split-warning">⚠️ ${p1.name}: -${diff} kcal niedobór</span>
                </div>`;
            } else if (modalSelectedPersons.length === 2) {
                // Tryb "Razem" - normalne sumowanie
                multiplier = p1.portion + p2.portion;
            } else {
                // Pojedyncza osoba
                const person = persons.find(p => p.id === modalSelectedPersons[0]);
                if (person) multiplier = person.portion;
            }

            // Mnożenie przez liczbę porcji wybranych przez użytkownika
            const baseMultiplier = multiplier; // Zapamiętaj przed mnożeniem przez porcje
            multiplier *= modalPortions;

            // Pokaż info o mnożniku
            const multiplierEl = document.getElementById('modal-multiplier');
            const portionsInfo = modalPortions > 1 ? ` × ${modalPortions} porcji` : '';
            if (modalSplitMode.startsWith('5050')) {
                multiplierEl.innerHTML = splitInfo + (modalPortions > 1 ? `<div style="margin-top:8px">📦 <strong>${modalPortions} porcji</strong> = łącznie ${multiplier.toFixed(2)}x</div>` : '');
            } else if (modalSelectedPersons.length === 2) {
                multiplierEl.innerHTML = `Składniki dla obu osób (${p1.portion}x + ${p2.portion}x = ${baseMultiplier.toFixed(2)}x)${portionsInfo}` + (modalPortions > 1 ? ` = <strong>${multiplier.toFixed(2)}x</strong>` : '');
            } else {
                const person = persons.find(p => p.id === modalSelectedPersons[0]);
                multiplierEl.innerHTML = `Składniki dla: <strong>${person.name}</strong> (${person.portion}x)${portionsInfo}` + (modalPortions > 1 ? ` = <strong>${multiplier.toFixed(2)}x</strong>` : '');
            }

            // Przelicz makra
            const kcal = Math.round(r.kcal * multiplier);
            const protein = Math.round(r.protein * multiplier);
            const fat = Math.round(r.fat * multiplier);
            const carbs = Math.round(r.carbs * multiplier);

            document.getElementById('modal-macros').innerHTML = `
                <div class="modal-macro"><div class="modal-macro-value">${kcal}</div><div class="modal-macro-label">Kalorie</div></div>
                <div class="modal-macro"><div class="modal-macro-value">${protein}g</div><div class="modal-macro-label">Białko</div></div>
                <div class="modal-macro"><div class="modal-macro-value">${fat}g</div><div class="modal-macro-label">Tłuszcze</div></div>
                <div class="modal-macro"><div class="modal-macro-value">${carbs}g</div><div class="modal-macro-label">Węgle</div></div>`;

            // Przelicz składniki
            document.getElementById('modal-ingredients').innerHTML = r.ingredients.map((i, index) => {
                const amount = Math.round(i.amount * multiplier * 10) / 10;
                const hasSubstitutes = i.substitutes && i.substitutes.length > 0;
                const substituteBtn = hasSubstitutes
                    ? `<button class="substitute-btn" onclick="toggleSubstitutePopup(${index}, event)" title="Zamienniki">↔</button>`
                    : '';
                return `<li class="ingredient-item">
                    <span class="ingredient-text">${i.item} - <strong>${amount} ${i.unit}</strong></span>
                    ${substituteBtn}
                    <div class="substitute-popup" id="substitute-popup-${index}" style="display:none;"></div>
                </li>`;
            }).join('');
            closeAllSubstitutePopups();

            // Sekcja podziału na talerze
            let portionSplitSection = document.getElementById('modal-portion-split');
            if (!portionSplitSection) {
                // Utwórz sekcję jeśli nie istnieje
                const ingredientsSection = document.getElementById('modal-ingredients').parentElement;
                portionSplitSection = document.createElement('div');
                portionSplitSection.className = 'modal-section';
                portionSplitSection.id = 'modal-portion-split';
                ingredientsSection.after(portionSplitSection);
            }

            // Pokaż tabelę podziału tylko dla "Razem" lub "50/50"
            if (modalSelectedPersons.length === 2 || modalSplitMode.startsWith('5050')) {
                let amount1, amount2;

                if (modalSplitMode.startsWith('5050')) {
                    // 50/50 - równy podział
                    amount1 = portionPerPerson;
                    amount2 = portionPerPerson;
                } else {
                    // Razem - proporcjonalny podział
                    amount1 = p1.portion;
                    amount2 = p2.portion;
                }

                let tableHTML = `
                    <h3>📋 Podział na talerze</h3>
                    <div class="portion-split-table">
                        <div class="portion-split-header">
                            <span>Składnik</span>
                            <span class="portion-split-person">
                                <span class="portion-split-dot" style="background: ${p1.color}"></span>
                                ${p1.name}
                            </span>
                            <span class="portion-split-person">
                                <span class="portion-split-dot" style="background: ${p2.color}"></span>
                                ${p2.name}
                            </span>
                        </div>`;

                tableHTML += r.ingredients.map(i => {
                    const a1 = Math.round(i.amount * amount1 * 10) / 10;
                    const a2 = Math.round(i.amount * amount2 * 10) / 10;
                    return `
                        <div class="portion-split-row">
                            <span class="portion-split-item">${i.item}</span>
                            <span class="portion-split-amount person1">${a1} ${i.unit}</span>
                            <span class="portion-split-amount person2">${a2} ${i.unit}</span>
                        </div>`;
                }).join('');

                tableHTML += '</div>';
                portionSplitSection.innerHTML = tableHTML;
                portionSplitSection.style.display = 'block';
            } else {
                portionSplitSection.style.display = 'none';
            }
        }

        function closeModal(e) {
            if (!e || e.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
                document.body.style.overflow = '';
                closeAllSubstitutePopups();
            }
        }

        // ===========================================
        // ZAMIENNIKI SKŁADNIKÓW (SUBSTITUTES)
        // ===========================================
        let currentOpenSubstitutePopup = null;

        function toggleSubstitutePopup(ingredientIndex, event) {
            event.stopPropagation();

            const popup = document.getElementById(`substitute-popup-${ingredientIndex}`);
            if (!popup) return;

            // Zamknij inny otwarty popup
            if (currentOpenSubstitutePopup !== null && currentOpenSubstitutePopup !== ingredientIndex) {
                closeSubstitutePopup(currentOpenSubstitutePopup);
            }

            if (popup.style.display === 'none' || popup.style.display === '') {
                renderSubstitutePopup(ingredientIndex);
                popup.style.display = 'block';
                currentOpenSubstitutePopup = ingredientIndex;
            } else {
                closeSubstitutePopup(ingredientIndex);
            }
        }

        function closeSubstitutePopup(ingredientIndex) {
            const popup = document.getElementById(`substitute-popup-${ingredientIndex}`);
            if (popup) {
                popup.style.display = 'none';
            }
            if (currentOpenSubstitutePopup === ingredientIndex) {
                currentOpenSubstitutePopup = null;
            }
        }

        function closeAllSubstitutePopups() {
            if (currentOpenSubstitutePopup !== null) {
                closeSubstitutePopup(currentOpenSubstitutePopup);
            }
        }

        function renderSubstitutePopup(ingredientIndex) {
            const r = currentModalRecipe;
            if (!r || !r.ingredients[ingredientIndex]) return;

            const ingredient = r.ingredients[ingredientIndex];
            if (!ingredient.substitutes || ingredient.substitutes.length === 0) return;

            const popup = document.getElementById(`substitute-popup-${ingredientIndex}`);
            if (!popup) return;

            // Oblicz ten sam multiplier co dla głównych składników
            const p1 = persons[0];
            const p2 = persons[1];
            let multiplier = 0;

            if (modalSplitMode === '5050-person1') {
                multiplier = p1.portion * 2;
            } else if (modalSplitMode === '5050-person2') {
                multiplier = p2.portion * 2;
            } else if (modalSelectedPersons.length === 2) {
                multiplier = p1.portion + p2.portion;
            } else {
                const person = persons.find(p => p.id === modalSelectedPersons[0]);
                if (person) multiplier = person.portion;
            }
            multiplier *= modalPortions;

            const substituteItems = ingredient.substitutes.map(sub => {
                const scaledAmount = Math.round(sub.amount * multiplier * 10) / 10;
                return `
                    <li class="substitute-item">
                        <span class="substitute-name">${sub.item}</span>
                        <span class="substitute-amount">${scaledAmount} ${sub.unit}</span>
                    </li>
                `;
            }).join('');

            popup.innerHTML = `
                <div class="substitute-header">
                    <span>Zamienniki dla: ${ingredient.item}</span>
                    <button class="substitute-close" onclick="closeSubstitutePopup(${ingredientIndex})">×</button>
                </div>
                <ul class="substitute-list">
                    ${substituteItems}
                </ul>
            `;
        }

        // Zamknij popup zamienników przy kliknięciu poza nim
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.substitute-btn') && !event.target.closest('.substitute-popup')) {
                closeAllSubstitutePopups();
            }
        });

        // FILTRY LISTY ZAKUPÓW
        let shoppingListSelection = {
            days: [...days],
            mealTypes: [...mealTypes]
        };

        function loadShoppingSelection() {
            const saved = localStorage.getItem('shoppingListSelection');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    shoppingListSelection.days = parsed.days || [...days];
                    shoppingListSelection.mealTypes = parsed.mealTypes || [...mealTypes];
                } catch(e) {}
            }
        }

        function saveShoppingSelection() {
            localStorage.setItem('shoppingListSelection', JSON.stringify(shoppingListSelection));
        }

        // ODHACZONE PRODUKTY NA LIŚCIE ZAKUPÓW
        let checkedShoppingItems = new Set();

        function loadCheckedItems() {
            const saved = localStorage.getItem('checkedShoppingItems');
            if (saved) {
                try {
                    checkedShoppingItems = new Set(JSON.parse(saved));
                } catch(e) {}
            }
        }

        function saveCheckedItems() {
            localStorage.setItem('checkedShoppingItems', JSON.stringify([...checkedShoppingItems]));
        }

        function toggleShoppingItem(item, checked) {
            if (checked) {
                checkedShoppingItems.add(item);
            } else {
                checkedShoppingItems.delete(item);
            }
            saveCheckedItems();
        }

        function clearCheckedItems() {
            checkedShoppingItems.clear();
            saveCheckedItems();
            renderShoppingList();
        }

        function renderShoppingDaysFilter() {
            const container = document.getElementById('shopping-days');
            if (!container) return;
            container.innerHTML = days.map(day => {
                const isSelected = shoppingListSelection.days.includes(day);
                const shortName = day.substring(0, 3);
                return `
                    <div class="shopping-day-checkbox ${isSelected ? 'selected' : ''}"
                         onclick="toggleShoppingDay('${day}')">
                        <span class="shopping-day-name">${shortName}</span>
                    </div>
                `;
            }).join('');
            updateShoppingSummary();
            updateMealCheckboxes();
        }

        function updateMealCheckboxes() {
            const breakfastCb = document.getElementById('meal-breakfast');
            const lunchCb = document.getElementById('meal-lunch');
            const dinnerCb = document.getElementById('meal-dinner');
            if (breakfastCb) breakfastCb.checked = shoppingListSelection.mealTypes.includes('breakfast');
            if (lunchCb) lunchCb.checked = shoppingListSelection.mealTypes.includes('lunch');
            if (dinnerCb) dinnerCb.checked = shoppingListSelection.mealTypes.includes('dinner');
        }

        function toggleShoppingDay(day) {
            const idx = shoppingListSelection.days.indexOf(day);
            if (idx > -1) {
                shoppingListSelection.days.splice(idx, 1);
            } else {
                shoppingListSelection.days.push(day);
            }
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function toggleShoppingMealType(mealType) {
            const idx = shoppingListSelection.mealTypes.indexOf(mealType);
            if (idx > -1) {
                shoppingListSelection.mealTypes.splice(idx, 1);
            } else {
                shoppingListSelection.mealTypes.push(mealType);
            }
            updateShoppingSummary();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectAllDays() {
            shoppingListSelection.days = [...days];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function deselectAllDays() {
            shoppingListSelection.days = [];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectWeekdays() {
            shoppingListSelection.days = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek'];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectWeekend() {
            shoppingListSelection.days = ['Sobota', 'Niedziela'];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function updateShoppingSummary() {
            const numDays = shoppingListSelection.days.length;
            const numMealTypes = shoppingListSelection.mealTypes.length;
            const numPersons = persons.length;
            const total = numDays * numMealTypes * numPersons;

            const summary = document.getElementById('shopping-summary');
            if (summary) {
                if (total === 0) {
                    summary.innerHTML = '⚠️ Nie wybrano żadnych posiłków';
                } else {
                    summary.innerHTML = `🛒 Wybrano: <strong>${total}</strong> posiłków (${numDays} dni × ${numMealTypes} posiłki × ${numPersons} osoby)`;
                }
            }
        }

        // LISTA ZAKUPÓW - z uwzględnieniem mnożników porcji i filtrów
        function renderShoppingList() {
            const list = {};
            let total = 0;
            // Używamy filtrowanych dni i typów posiłków
            shoppingListSelection.days.forEach(day => {
                shoppingListSelection.mealTypes.forEach(mt => {
                    const meal = plan[day]?.[mt];
                    if (!meal) return;
                    // Osobne receptury dla każdej osoby
                    persons.forEach(person => {
                        const recipeId = meal[person.id];
                        if (recipeId) {
                            total++;
                            const r = recipes[mt].find(x => x.id === recipeId);
                            if (r) {
                                r.ingredients.forEach(ing => {
                                    const k = `${ing.item} (${ing.unit})`;
                                    list[k] = (list[k] || 0) + (ing.amount * person.portion);
                                });
                            }
                        }
                    });
                });
            });

            Object.keys(list).forEach(k => list[k] = Math.ceil(list[k] * 10) / 10);

            // Pokaż info o osobach
            const personsInfo = persons.map(p => `${p.name} (${p.portion}x)`).join(' + ');
            document.getElementById('shopping-info').textContent = total > 0
                ? `${total} posiłków dla: ${personsInfo}`
                : '';

            const container = document.getElementById('shopping-list');
            container.innerHTML = '';

            if (Object.keys(list).length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px;">Najpierw zaplanuj posiłki</p>';
                return;
            }

            categories.forEach(cat => {
                const items = Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw)));
                if (items.length === 0) return;

                const div = document.createElement('div');
                div.className = 'category';
                div.innerHTML = `<h3>${cat.name}</h3>`;
                items.forEach(([item, amt]) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    const isChecked = checkedShoppingItems.has(item);
                    const escapedItem = item.replace(/'/g, "\\'");
                    itemDiv.innerHTML = `
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleShoppingItem('${escapedItem}', this.checked); this.nextElementSibling.classList.toggle('checked', this.checked)">
                        <span class="item-name ${isChecked ? 'checked' : ''}">${item}</span>
                        <span class="item-amount">${amt}</span>`;
                    div.appendChild(itemDiv);
                });
                container.appendChild(div);
            });
        }

        function copyShoppingList() {
            const list = {};
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    const meal = plan[day][mt];
                    // Osobne receptury dla każdej osoby
                    persons.forEach(person => {
                        const recipeId = meal[person.id];
                        if (recipeId) {
                            const r = recipes[mt].find(x => x.id === recipeId);
                            if (r) {
                                r.ingredients.forEach(ing => {
                                    const k = `${ing.item} (${ing.unit})`;
                                    list[k] = (list[k] || 0) + (ing.amount * person.portion);
                                });
                            }
                        }
                    });
                });
            });
            Object.keys(list).forEach(k => list[k] = Math.ceil(list[k] * 10) / 10);

            const personsInfo = persons.map(p => `${p.name} (${p.portion}x)`).join(' + ');
            let txt = `🛒 LISTA ZAKUPÓW\nDla: ${personsInfo}\n\n`;
            let hasItems = false;
            categories.forEach(cat => {
                const items = Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw)) && !checkedShoppingItems.has(item));
                if (items.length === 0) return;
                hasItems = true;
                txt += cat.name + "\n";
                items.forEach(([item, amt]) => txt += `☐ ${item}: ${amt}\n`);
                txt += "\n";
            });

            if (!hasItems) {
                alert('Wszystkie produkty zostały odhaczone! Nie ma nic do skopiowania.');
                return;
            }

            navigator.clipboard.writeText(txt).then(() => alert('Lista skopiowana do schowka!\n\n(Odhaczone produkty zostały pominięte)'));
        }

        // Udostępnianie listy zakupów (natywne iOS/Android)
        function shareShoppingList() {
            const list = {};
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    const meal = plan[day][mt];
                    persons.forEach(person => {
                        const recipeId = meal[person.id];
                        if (recipeId) {
                            const r = recipes[mt].find(x => x.id === recipeId);
                            if (r) {
                                r.ingredients.forEach(ing => {
                                    const k = `${ing.item} (${ing.unit})`;
                                    list[k] = (list[k] || 0) + (ing.amount * person.portion);
                                });
                            }
                        }
                    });
                });
            });
            Object.keys(list).forEach(k => list[k] = Math.ceil(list[k] * 10) / 10);

            const personsInfo = persons.map(p => `${p.name} (${p.portion}x)`).join(' + ');
            let txt = `🛒 LISTA ZAKUPÓW\nDla: ${personsInfo}\n\n`;
            let hasItems = false;
            categories.forEach(cat => {
                const items = Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw)) && !checkedShoppingItems.has(item));
                if (items.length === 0) return;
                hasItems = true;
                txt += cat.name + "\n";
                items.forEach(([item, amt]) => txt += `☐ ${item}: ${amt}\n`);
                txt += "\n";
            });

            if (!hasItems) {
                alert('Wszystkie produkty zostały odhaczone! Nie ma nic do wysłania.');
                return;
            }

            if (navigator.share) {
                navigator.share({
                    title: 'Lista zakupów',
                    text: txt
                }).catch(() => {
                    // Użytkownik anulował - kopiuj do schowka
                    navigator.clipboard.writeText(txt).then(() => {
                        alert('Lista skopiowana do schowka!\nWyślij przez SMS lub komunikator.');
                    });
                });
            } else {
                navigator.clipboard.writeText(txt).then(() => {
                    alert('Lista skopiowana do schowka!\nWyślij przez SMS lub komunikator.');
                });
            }
        }

        // ZAPIS/ODCZYT
        function savePlan() {
            localStorage.setItem('mealPlanV5', JSON.stringify(plan));
        }

        function savePersons() {
            localStorage.setItem('mealPersons', JSON.stringify(persons));
        }

        function loadPersons() {
            const saved = localStorage.getItem('mealPersons');
            if (saved) {
                try {
                    persons = JSON.parse(saved);
                } catch(e) {}
            }
        }

        // Migracja starych danych do nowej struktury V5 (osobne receptury per osoba)
        function migratePlan(oldPlan) {
            const newPlan = {};
            days.forEach(day => {
                newPlan[day] = {};
                mealTypes.forEach(mt => {
                    const oldValue = oldPlan[day] ? oldPlan[day][mt] : null;

                    // V5 format: { 1: 'recipeId', 2: 'recipeId' }
                    if (oldValue && typeof oldValue === 'object' && oldValue[1] !== undefined) {
                        newPlan[day][mt] = oldValue;
                    }
                    // V4 format: { recipe: 'id', persons: [1,2] }
                    else if (oldValue && typeof oldValue === 'object' && oldValue.recipe !== undefined) {
                        newPlan[day][mt] = { 1: null, 2: null };
                        if (oldValue.persons && oldValue.persons.includes(1)) {
                            newPlan[day][mt][1] = oldValue.recipe;
                        }
                        if (oldValue.persons && oldValue.persons.includes(2)) {
                            newPlan[day][mt][2] = oldValue.recipe;
                        }
                    }
                    // V3 format: string recipe ID
                    else if (oldValue && typeof oldValue === 'string') {
                        newPlan[day][mt] = { 1: oldValue, 2: oldValue };
                    }
                    // Pusty
                    else {
                        newPlan[day][mt] = { 1: null, 2: null };
                    }
                });
            });
            return newPlan;
        }

        function loadPlan() {
            // Sprawdź URL
            const params = new URLSearchParams(window.location.search);
            const urlPlan = params.get('plan');
            if (urlPlan) {
                try {
                    const loadedPlan = JSON.parse(decodeURIComponent(atob(urlPlan)));
                    plan = migratePlan(loadedPlan);
                    document.getElementById('loaded-alert').style.display = 'flex';
                    window.history.replaceState({}, '', window.location.pathname);
                    savePlan();
                    return;
                } catch(e) {}
            }

            // Sprawdź localStorage - nowy format V5
            let saved = localStorage.getItem('mealPlanV5');
            if (saved) {
                try {
                    plan = JSON.parse(saved);
                    return;
                } catch(e) {}
            }

            // Migracja z V4
            saved = localStorage.getItem('mealPlanV4');
            if (saved) {
                try {
                    const oldPlan = JSON.parse(saved);
                    plan = migratePlan(oldPlan);
                    savePlan();
                    return;
                } catch(e) {}
            }

            // Migracja ze starego formatu V3
            saved = localStorage.getItem('mealPlanV3');
            if (saved) {
                try {
                    const oldPlan = JSON.parse(saved);
                    plan = migratePlan(oldPlan);
                    savePlan();
                } catch(e) {}
            }
        }

        function hideLoadedAlert() {
            document.getElementById('loaded-alert').style.display = 'none';
            savePlan();
        }

        // Udostępnianie planu przez link
        function sharePlan() {
            try {
                const planData = btoa(encodeURIComponent(JSON.stringify(plan)));
                const shareUrl = window.location.origin + window.location.pathname + '?plan=' + planData;

                if (navigator.share) {
                    // Natywne udostępnianie (iOS/Android)
                    navigator.share({
                        title: 'Mój jadłospis',
                        text: 'Sprawdź mój plan posiłków na tydzień!',
                        url: shareUrl
                    }).catch(() => {
                        // Użytkownik anulował - kopiuj do schowka jako fallback
                        copyToClipboard(shareUrl);
                    });
                } else {
                    // Brak natywnego udostępniania - kopiuj do schowka
                    copyToClipboard(shareUrl);
                }
            } catch(e) {
                alert('Błąd podczas generowania linku. Spróbuj ponownie.');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Link skopiowany do schowka!\n\nWyślij go przez SMS, WhatsApp lub inny komunikator.');
            }).catch(() => {
                // Fallback dla starszych przeglądarek
                prompt('Skopiuj ten link:', text);
            });
        }

        // INIT
        loadPersons();
        loadPlan();
        loadEatenMeals();
        loadFavorites();
        loadShoppingSelection();
        loadCheckedItems();
        // Przelicz TDEE dla załadowanych osób
        persons.forEach(p => recalculatePerson(p));
        renderSettingsPanel();
        renderPersonsPanel();
        updateTableHeaders();
        renderPlannerTable();
        renderRecipes();
    </script>
</body>
</html>
