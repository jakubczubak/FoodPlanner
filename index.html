                <select class="recipes-person-btn" onchange="setRecipesMealType(this.value)" style="padding: 8px 12px;">
                    ${mealTypes.map(mt => `
                        <option value="${mt}" ${mt === selectedRecipesMealType ? 'selected' : ''}>
                            ${mealTypeNames[mt]}
                        </option>
                    `).join('')}
                </select>
                ${mealTarget ? `
                    <div class="recipes-person-info">
                        Cel (${mealTypeNames[selectedRecipesMealType]}):
                        <strong>${mealTarget.kcal} kcal</strong> |
                        B:${mealTarget.protein}g T:${mealTarget.fat}g W:${mealTarget.carbs}g
                    </div>
                ` : ''}
            `;
        }

        function setRecipesPerson(personId) {
            selectedRecipesPerson = personId;
            renderRecipesPersonSelector();
            renderRecipes(currentRecipeFilter);
        }

        function setRecipesMealType(mealType) {
            selectedRecipesMealType = mealType;
            renderRecipesPersonSelector();
            renderRecipes(currentRecipeFilter);
        }

        // PRZEPISY
        function renderRecipes(filter = 'all') {
            currentRecipeFilter = filter;
            const grid = document.getElementById('recipes-grid');
            grid.innerHTML = '';

            // Dla nowych filtrów przeszukuj wszystkie typy posiłków
            const specialFilters = ['all', 'favorites', 'oven', 'chicken', 'pasta', 'asian', 'mexican',
                'eggs', 'sandwiches', 'dairy', 'pancakes', 'oatmeal', 'meat', 'pizza', 'soups', 'salads', 'fish', 'casseroles', 'shakes'];
            const types = specialFilters.includes(filter) ? mealTypes : [filter];

            // Mapowanie filtrów na kategorie
            const categoryFilters = {
                eggs: 'Jajka',
                sandwiches: 'Kanapki',
                dairy: 'Nabiał',
                pancakes: 'Naleśniki',
                oatmeal: 'Owsianki',
                chicken: 'Kurczak',
                meat: 'Wołowina/Wieprzowina',
                pasta: 'Makarony',
                asian: 'Ryż/Azja',
                pizza: 'Pizza/Kebab',
                mexican: 'Meksykańskie',
                soups: 'Zupy',
                salads: 'Sałatki',
                fish: 'Ryby',
                casseroles: 'Zapiekanki',
                shakes: "Shake'i"
            };

            let hasRecipes = false;

            types.forEach(mt => {
                recipes[mt].forEach(r => {
                    // Jeśli filtrujemy ulubione, pomiń nie-ulubione
                    if (filter === 'favorites' && !favoriteRecipes.has(r.id)) {
                        return;
                    }

                    // NOWE: Filtr "z piekarnika" - szuka w steps
                    if (filter === 'oven') {
                        const hasOven = r.steps.some(step =>
                            step.toLowerCase().includes('piekarnik')
                        );
                        if (!hasOven) return;
                    }

                    // Filtry po kategorii (uniwersalne)
                    if (categoryFilters[filter] && !r.category.includes(categoryFilters[filter])) {
                        return;
                    }

                    // Filtrowanie po wyszukiwanym tekście (nazwa, składniki, zamienniki i instrukcje)
                    if (currentSearchTerm) {
                        const termLower = currentSearchTerm;
                        const matchesName = r.name.toLowerCase().includes(termLower);
                        const matchesIngredient = r.ingredients.some(ing =>
                            ing.item.toLowerCase().includes(termLower)
                        );
                        const matchesSubstitute = r.ingredients.some(ing =>
                            ing.substitutes && ing.substitutes.some(sub =>
                                sub.item.toLowerCase().includes(termLower)
                            )
                        );
                        const matchesSteps = r.steps.some(step =>
                            step.toLowerCase().includes(termLower)
                        );
                        if (!matchesName && !matchesIngredient && !matchesSubstitute && !matchesSteps) return;
                    }

                    hasRecipes = true;
                    const isFav = favoriteRecipes.has(r.id);

                    // Oblicz zoptymalizowane wartości dla wybranej osoby i typu posiłku
                    const person = persons.find(p => p.id === selectedRecipesPerson) || persons[0];
                    const mealTarget = calculateMealTargets(person, selectedRecipesMealType);
                    let optimized = null;
                    if (mealTarget) {
                        optimized = optimizeIngredients(r, mealTarget, person.portion);
                    }

                    const displayKcal = optimized ? optimized.nutrition.kcal : r.kcal;
                    const displayProtein = optimized ? optimized.nutrition.protein : r.protein;
                    const displayFat = optimized ? optimized.nutrition.fat : r.fat;
                    const displayCarbs = optimized ? optimized.nutrition.carbs : r.carbs;

                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.onclick = () => openRecipeModal(mt, r);
                    card.innerHTML = `
                        <div class="recipe-header ${mt}">
                            <button class="favorite-btn ${isFav ? 'active' : ''}"
                                onclick="toggleFavorite('${r.id}', event)"
                                title="${isFav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych'}">
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                            <div class="recipe-type">${mealNames[mt]}</div>
                            <div class="recipe-name">${r.name}</div>
                        </div>
                        <div class="recipe-body">
                            <div class="recipe-macros-optimized">
                                <div class="macro-optimized"><strong>${displayKcal}</strong> kcal</div>
                                <div class="macro-optimized"><strong>${displayProtein}g</strong> B</div>
                                <div class="macro-optimized"><strong>${displayFat}g</strong> T</div>
                                <div class="macro-optimized"><strong>${displayCarbs}g</strong> W</div>
                            </div>
                            <div class="recipe-target-info">
                                <span class="target-badge">${person.name}</span>
                                Oryginał: ${r.kcal} kcal
                            </div>
                            <div class="recipe-preview">${r.ingredients.slice(0,3).map(x=>x.item).join(', ')}...</div>
                        </div>`;
                    grid.appendChild(card);
                });
            });

            // Pokaż komunikat gdy brak ulubionych
            if (filter === 'favorites' && !hasRecipes) {
                grid.innerHTML = `
                    <div class="no-favorites">
                        <div class="no-favorites-icon">🤍</div>
                        <div class="no-favorites-text">Nie masz jeszcze ulubionych przepisów</div>
                        <div class="no-favorites-hint">Kliknij serduszko na karcie przepisu, aby dodać go do ulubionych</div>
                    </div>`;
            }

            // Pokaż komunikat gdy brak wyników wyszukiwania
            if (currentSearchTerm && !hasRecipes) {
                grid.innerHTML = `
                    <div class="no-results">
                        <p>Nie znaleziono przepisów dla "<strong>${currentSearchTerm}</strong>"</p>
                        <button onclick="clearSearch()">Wyczyść wyszukiwanie</button>
                    </div>`;
            }
        }

        function filterRecipes(f, btn) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderRecipes(f);
        }

        // Funkcja podglądu przepisu z planera
        function previewRecipe(mealType, recipeId, day = null) {
            if (!recipeId) return;
            const recipe = recipes[mealType].find(r => r.id === recipeId);
            if (recipe) {
                currentPlanDay = day; // Zapisz dzień dla optymalizacji
                openRecipeModal(mealType, recipe);
            }
        }

        // Aktualnie wyświetlany przepis i wybrane osoby
        let currentModalRecipe = null;
        let currentModalMealType = null; // Typ posiłku (breakfast/lunch/dinner)
        let modalSelectedPersons = [1]; // Domyślnie tylko "Ja"
        let modalPortions = 1; // Liczba porcji wybrana przez użytkownika
        let modalOptimizedIngredients = null; // Wynik optymalizacji składników
        let mealOptimizations = {}; // Zapisane optymalizacje: { 'dzień_typ_osoba_przepis': result }
        let currentPlanDay = null; // Aktualny dzień przy otwieraniu modalu z planera

        function openRecipeModal(mt, r) {
            currentModalRecipe = r;
            currentModalMealType = mt; // Zapisz typ posiłku
            modalSelectedPersons = [1]; // Reset do "tylko ja"
            modalPortions = 1; // Reset porcji do 1
            modalOptimizedIngredients = null; // Reset optymalizacji

            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-header').className = 'modal-header ' + mt;
            document.getElementById('modal-type').textContent = mealNames[mt];
            document.getElementById('modal-name').textContent = r.name;

            // Renderuj przełącznik osób
            renderModalPersonsToggle();

            // Renderuj resztę (makra, składniki)
            updateModalContent();

            document.getElementById('modal-steps').innerHTML = r.steps.map(s => `<li>${s}</li>`).join('');
            document.body.style.overflow = 'hidden';

            // Automatyczna optymalizacja jeśli otwieramy z planera (mamy dzień)
            setTimeout(() => {
                if (currentPlanDay) {
                    applyOptimization();
                }
            }, 150);
        }

        function renderModalPersonsToggle() {
            const toggle = document.getElementById('modal-persons-toggle');

            let html = '';

            // Przyciski dla każdej osoby
            persons.forEach(p => {
                const isActive = modalSelectedPersons.length === 1 &&
                                modalSelectedPersons[0] === p.id;
                html += `
                    <button class="modal-person-btn ${isActive ? 'active' : ''}"
                        style="border-color: ${p.color}; ${isActive ? `background: ${p.color}20` : ''}"
                        onclick="setModalPersons([${p.id}])">
                        <span class="modal-person-dot" style="background: ${p.color}"></span>
                        ${p.name}
                    </button>
                `;
            });

            // Przycisk "Razem" - tylko gdy więcej niż 1 osoba
            if (persons.length > 1) {
                const allIds = persons.map(p => p.id);
                const isRazemActive = modalSelectedPersons.length === persons.length;
                html += `
                    <button class="modal-person-btn both ${isRazemActive ? 'active' : ''}"
                        onclick="setModalPersons([${allIds.join(',')}])">
                        ${persons.map(p => `<span class="modal-person-dot" style="background: ${p.color}"></span>`).join('')}
                        Razem
                    </button>
                `;
            }

            toggle.innerHTML = html;
        }

        function setModalPersons(personIds) {
            modalSelectedPersons = personIds;
            modalOptimizedIngredients = null; // Reset optymalizacji przy zmianie osób
            renderModalPersonsToggle();
            updateModalContent();

            // Re-optymalizuj przy zmianie osób (jeśli z planera)
            if (currentPlanDay) {
                applyOptimization();
            }
        }

        function changePortions(delta) {
            modalPortions = Math.max(1, modalPortions + delta);

            // Aktualizuj wyświetlanie kontrolki porcji
            document.getElementById('modal-portions-control').innerHTML = `
                <div class="portions-selector">
                    <span class="portions-label">🍽️ Porcji:</span>
                    <button class="portions-btn" onclick="changePortions(-1)" ${modalPortions <= 1 ? 'disabled' : ''}>−</button>
                    <span class="portions-value">${modalPortions}</span>
                    <button class="portions-btn" onclick="changePortions(1)">+</button>
                </div>
            `;

            // Automatycznie uruchom optymalizację po zmianie porcji
            applyOptimization();
        }

        function updateModalContent() {
            const r = currentModalRecipe;
            if (!r) return;

            // Renderuj kontrolkę porcji
            document.getElementById('modal-portions-control').innerHTML = `
                <div class="portions-selector">
                    <span class="portions-label">🍽️ Porcji:</span>
                    <button class="portions-btn" onclick="changePortions(-1)" ${modalPortions <= 1 ? 'disabled' : ''}>−</button>
                    <span class="portions-value">${modalPortions}</span>
                    <button class="portions-btn" onclick="changePortions(1)">+</button>
                </div>
            `;

            const multiplierEl = document.getElementById('modal-multiplier');
            const optimizationSection = document.getElementById('modal-optimization');
            let displayMacros, ingredientsHtml;

            // Tryb "Razem" - automatycznie optymalizuj dla każdej osoby i sumuj
            if (modalSelectedPersons.length > 1 && currentModalMealType) {
                // Dla każdej osoby optymalizuj osobno i sumuj składniki
                let combinedIngredients = {};
                let combinedNutrition = { kcal: 0, protein: 0, fat: 0, carbs: 0 };
                let combinedTarget = { kcal: 0, protein: 0, fat: 0, carbs: 0 };
                const personsInfo = [];

                // Sprawdź czy użytkownik chce oryginalne (nie zoptymalizowane)
                const showOriginal = modalOptimizedIngredients === false; // false = użytkownik kliknął "Przywróć oryginalne"

                if (showOriginal) {
                    // Pokaż oryginalne składniki (suma mnożników)
                    let totalMultiplier = 0;
                    for (const personId of modalSelectedPersons) {
                        const person = persons.find(p => p.id === personId);
                        if (!person) continue;
                        const mealTarget = calculateMealTargets(person, currentModalMealType);
                        if (!mealTarget) continue;

                        totalMultiplier += person.portion * modalPortions;
                        combinedTarget.kcal += mealTarget.kcal * modalPortions;
                        combinedTarget.protein += mealTarget.protein * modalPortions;
                        combinedTarget.fat += mealTarget.fat * modalPortions;
                        combinedTarget.carbs += mealTarget.carbs * modalPortions;
                        personsInfo.push(`${person.name} (${person.portion}x)`);
                    }

                    // Oryginalne składniki
                    for (const ing of r.ingredients) {
                        combinedIngredients[ing.item] = {
                            item: ing.item,
                            amount: Math.round(ing.amount * totalMultiplier * 10) / 10,
                            unit: ing.unit
                        };
                    }
                    combinedNutrition = {
                        kcal: r.kcal * totalMultiplier,
                        protein: r.protein * totalMultiplier,
                        fat: r.fat * totalMultiplier,
                        carbs: r.carbs * totalMultiplier
                    };
                } else {
                    // Optymalizuj dla każdej osoby osobno (dla 1 porcji) i sumuj
                    for (const personId of modalSelectedPersons) {
                        const person = persons.find(p => p.id === personId);
                        if (!person) continue;

                        const mealTarget = calculateMealTargets(person, currentModalMealType);
                        if (!mealTarget) continue;

                        // Optymalizuj dla tej osoby (dla 1 porcji)
                        const result = optimizeIngredients(r, mealTarget, person.portion);

                        // Sumuj cele (mnożone przez liczbę porcji)
                        combinedTarget.kcal += mealTarget.kcal * modalPortions;
                        combinedTarget.protein += mealTarget.protein * modalPortions;
                        combinedTarget.fat += mealTarget.fat * modalPortions;
                        combinedTarget.carbs += mealTarget.carbs * modalPortions;

                        // Sumuj składniki (mnożone przez liczbę porcji)
                        for (const ing of result.ingredients) {
                            if (!combinedIngredients[ing.item]) {
                                combinedIngredients[ing.item] = { ...ing, amount: 0, unit: ing.unit };
                            }
                            combinedIngredients[ing.item].amount += ing.amount * modalPortions;
                        }

                        // Sumuj makra (mnożone przez liczbę porcji)
                        combinedNutrition.kcal += result.nutrition.kcal * modalPortions;
                        combinedNutrition.protein += result.nutrition.protein * modalPortions;
                        combinedNutrition.fat += result.nutrition.fat * modalPortions;
                        combinedNutrition.carbs += result.nutrition.carbs * modalPortions;

                        personsInfo.push(`${person.name} (${person.portion}x)`);
                    }
                }

                // Zaokrąglij składniki
                const ingredientsList = Object.values(combinedIngredients).map(ing => ({
                    ...ing,
                    amount: Math.round(ing.amount * 10) / 10
                }));

                displayMacros = {
                    kcal: Math.round(combinedNutrition.kcal),
                    protein: Math.round(combinedNutrition.protein),
                    fat: Math.round(combinedNutrition.fat),
                    carbs: Math.round(combinedNutrition.carbs)
                };

                // Info o trybie "Razem"
                const optimizedLabel = showOriginal ? '' : ' <span style="color: #7c3aed; font-weight: 600;">(zoptymalizowane)</span>';
                multiplierEl.innerHTML = `<strong>🍳 Razem dla:</strong> ${personsInfo.join(' + ')}${optimizedLabel}`;

                // Lista składników
                ingredientsHtml = ingredientsList.map((i, index) => {
                    const nutrition = calculateIngredientNutrition(i.item, i.amount, i.unit);
                    const ingredient = ingredientsDatabase[i.item];
                    const infoBtn = ingredient
                        ? `<button class="info-btn" onclick="toggleNutritionInfo(${index}, event)" title="Wartości na 100g">ℹ️</button>
                           <div class="nutrition-info-popup" id="nutrition-info-${index}" style="display:none;">
                               <strong>Na 100g:</strong><br>
                               ${ingredient.kcal} kcal | ${ingredient.protein}B | ${ingredient.fat}T | ${ingredient.carbs}W
                           </div>`
                        : '';
                    const macrosHtml = !nutrition.missing
                        ? `<span class="ingredient-macros">${Math.round(nutrition.kcal)} | ${Math.round(nutrition.protein)}B | ${Math.round(nutrition.fat)}T | ${Math.round(nutrition.carbs)}W</span>`
                        : '';
                    return `<li class="ingredient-item">
                        <div class="ingredient-main-row">
                            <span class="ingredient-text">${i.item} - <strong>${i.amount} ${i.unit}</strong></span>
                            ${infoBtn}
                        </div>
                        ${macrosHtml ? `<div class="ingredient-macros-row">${macrosHtml}</div>` : ''}
                    </li>`;
                }).join('');

                // Sekcja dopasowania - pokaż sumę celów vs obecne
                const diff = {
                    kcal: displayMacros.kcal - combinedTarget.kcal,
                    protein: displayMacros.protein - combinedTarget.protein,
                    fat: displayMacros.fat - combinedTarget.fat,
                    carbs: displayMacros.carbs - combinedTarget.carbs
                };

                const formatDiff = (val) => val >= 0 ? `+${val}` : `${val}`;
                const getDiffColor = (val, threshold) => {
                    const pct = Math.abs(val) / threshold * 100;
                    if (pct <= 8) return '#22c55e';
                    if (pct <= 15) return '#f59e0b';
                    return '#ef4444';
                };

                const mealNamePl = { breakfast: 'Śniadanie', lunch: 'Obiad', dinner: 'Kolacja' };

                optimizationSection.innerHTML = `
                    <div class="optimization-header">
                        <span>🎯 Suma celów dla wszystkich (${mealNamePl[currentModalMealType]})</span>
                    </div>
                    <div class="optimization-grid">
                        <div class="opt-row opt-header-row">
                            <span></span>
                            <span>kcal</span>
                            <span>Białko</span>
                            <span>Tłuszcz</span>
                            <span>Węgle</span>
                        </div>
                        <div class="opt-row">
                            <span class="opt-label">Cel razem:</span>
                            <span>${Math.round(combinedTarget.kcal)}</span>
                            <span>${Math.round(combinedTarget.protein)}g</span>
                            <span>${Math.round(combinedTarget.fat)}g</span>
                            <span>${Math.round(combinedTarget.carbs)}g</span>
                        </div>
                        <div class="opt-row">
                            <span class="opt-label">Osiągnięte:</span>
                            <span>${displayMacros.kcal}</span>
                            <span>${displayMacros.protein}g</span>
                            <span>${displayMacros.fat}g</span>
                            <span>${displayMacros.carbs}g</span>
                        </div>
                        <div class="opt-row opt-diff-row">
                            <span class="opt-label">Różnica:</span>
                            <span style="color: ${getDiffColor(diff.kcal, combinedTarget.kcal)}">${formatDiff(diff.kcal)}</span>
                            <span style="color: ${getDiffColor(diff.protein, combinedTarget.protein)}">${formatDiff(diff.protein)}</span>
                            <span style="color: ${getDiffColor(diff.fat, combinedTarget.fat)}">${formatDiff(diff.fat)}</span>
                            <span style="color: ${getDiffColor(diff.carbs, combinedTarget.carbs)}">${formatDiff(diff.carbs)}</span>
                        </div>
                    </div>
                    ${showOriginal ? `
                        <button class="optimize-btn" onclick="showOptimizedRazem()">
                            🔧 Pokaż zoptymalizowane
                        </button>
                    ` : `
                        <button class="reset-optimization-btn" onclick="showOriginalRazem()">
                            ↩️ Przywróć oryginalne
                        </button>
                    `}
                `;
                optimizationSection.style.display = 'block';

            } else {
                // Tryb pojedynczej osoby
                const person = persons.find(p => p.id === modalSelectedPersons[0]);
                const baseMultiplier = person ? person.portion : 1;

                // Sprawdź czy mamy zoptymalizowane składniki
                const isOptimized = modalOptimizedIngredients !== null && modalOptimizedIngredients !== false;

                let ingredientsList;
                let baseMacros;

                if (isOptimized) {
                    // Użyj zoptymalizowanych (już zawierają baseMultiplier)
                    ingredientsList = modalOptimizedIngredients.ingredients;
                    baseMacros = modalOptimizedIngredients.nutrition;
                } else {
                    // Użyj oryginalnych z przepisu (przemnożonych przez portion osoby)
                    ingredientsList = r.ingredients.map(ing => ({
                        item: ing.item,
                        amount: ing.amount * baseMultiplier,
                        unit: ing.unit
                    }));
                    baseMacros = {
                        kcal: r.kcal * baseMultiplier,
                        protein: r.protein * baseMultiplier,
                        fat: r.fat * baseMultiplier,
                        carbs: r.carbs * baseMultiplier
                    };
                }

                const portionsInfo = modalPortions > 1 ? ` × ${modalPortions} porcji` : '';
                const totalMultiplier = baseMultiplier * modalPortions;
                const optimizedLabel = isOptimized ? ' <span style="color: #7c3aed; font-weight: 600;">(zoptymalizowane)</span>' : '';
                multiplierEl.innerHTML = `Składniki dla: <strong>${person?.name || 'Nieznany'}</strong> (${person?.portion || 1}x)${portionsInfo}${optimizedLabel}` + (modalPortions > 1 ? ` = <strong>${totalMultiplier.toFixed(2)}x</strong>` : '');

                // Mnóż przez modalPortions
                displayMacros = {
                    kcal: Math.round(baseMacros.kcal * modalPortions),
                    protein: Math.round(baseMacros.protein * modalPortions),
                    fat: Math.round(baseMacros.fat * modalPortions),
                    carbs: Math.round(baseMacros.carbs * modalPortions)
                };

                ingredientsHtml = ingredientsList.map((i, index) => {
                    const amount = Math.round(i.amount * modalPortions * 10) / 10;
                    const nutrition = calculateIngredientNutrition(i.item, i.amount * modalPortions, i.unit);
                    const ingredient = ingredientsDatabase[i.item];
                    const infoBtn = ingredient
                        ? `<button class="info-btn" onclick="toggleNutritionInfo(${index}, event)" title="Wartości na 100g">ℹ️</button>
                           <div class="nutrition-info-popup" id="nutrition-info-${index}" style="display:none;">
                               <strong>Na 100g:</strong><br>
                               ${ingredient.kcal} kcal | ${ingredient.protein}B | ${ingredient.fat}T | ${ingredient.carbs}W
                           </div>`
                        : '';
                    const macrosHtml = !nutrition.missing
                        ? `<span class="ingredient-macros">${Math.round(nutrition.kcal)} | ${Math.round(nutrition.protein)}B | ${Math.round(nutrition.fat)}T | ${Math.round(nutrition.carbs)}W</span>`
                        : '';
                    const substitutes = getIngredientSubstitutes(i);
                    const hasSubstitutes = substitutes.length > 0;
                    const substituteBtn = `<button class="substitute-btn ${!hasSubstitutes ? 'no-substitutes' : ''}" onclick="toggleSubstitutePopup(${index}, event)" title="${hasSubstitutes ? 'Pokaż zamienniki' : 'Brak zamienników'}">↔</button>`;
                    return `<li class="ingredient-item">
                        <div class="ingredient-main-row">
                            <span class="ingredient-text">${i.item} - <strong>${amount} ${i.unit}</strong></span>
                            ${infoBtn}
                            ${substituteBtn}
                        </div>
                        ${macrosHtml ? `<div class="ingredient-macros-row">${macrosHtml}</div>` : ''}
                    </li>`;
                }).join('');

                // Sekcja dopasowania do celów makro - dla pojedynczej osoby
                if (person && currentModalMealType) {
                    const mealTarget = calculateMealTargets(person, currentModalMealType);
                    const allocationPct = Math.round((person.mealAllocation?.[currentModalMealType] || 0.33) * 100);

                    // Skaluj cele przez liczbę porcji
                    const scaledTarget = {
                        kcal: Math.round(mealTarget.kcal * modalPortions),
                        protein: Math.round(mealTarget.protein * modalPortions),
                        fat: Math.round(mealTarget.fat * modalPortions),
                        carbs: Math.round(mealTarget.carbs * modalPortions)
                    };

                    const diff = {
                        kcal: displayMacros.kcal - scaledTarget.kcal,
                        protein: displayMacros.protein - scaledTarget.protein,
                        fat: displayMacros.fat - scaledTarget.fat,
                        carbs: displayMacros.carbs - scaledTarget.carbs
                    };

                    const formatDiff = (val) => val >= 0 ? `+${val}` : `${val}`;
                    const getDiffColor = (val, threshold) => {
                        const pct = Math.abs(val) / threshold * 100;
                        if (pct <= 8) return '#22c55e';
                        if (pct <= 15) return '#f59e0b';
                        return '#ef4444';

                    const mealNamePl = { breakfast: 'Śniadanie', lunch: 'Obiad', dinner: 'Kolacja' };

                            <div class="opt-row">

                                <span>${displayMacros.protein}g</span>

                                <span>${displayMacros.carbs}g</span>
                            </div>
                            <div class="opt-row opt-diff-row">
                                <span class="opt-label">Różnica:</span>
                                <span style="color: ${getDiffColor(diff.kcal, scaledTarget.kcal)}">${formatDiff(diff.kcal)}</span>
                                <span style="color: ${getDiffColor(diff.protein, scaledTarget.protein)}">${formatDiff(diff.protein)}</span>
                                <span style="color: ${getDiffColor(diff.fat, scaledTarget.fat)}">${formatDiff(diff.fat)}</span>
                                <span style="color: ${getDiffColor(diff.carbs, scaledTarget.carbs)}">${formatDiff(diff.carbs)}</span>

                        <button class="optimize-btn" onclick="applyOptimization()">

                        ${modalOptimizedIngredients ? `
                            <button class="reset-optimization-btn" onclick="resetOptimization()">
                                ↩️ Przywróć oryginalne
                            </button>
                        ` : ''}
                    `;
                    optimizationSection.style.display = 'block';
                } else {
                    optimizationSection.style.display = 'none';

            // Pokaż makra
            document.getElementById('modal-macros').innerHTML = `
                <div class="modal-macro"><div class="modal-macro-value">${displayMacros.kcal}</div><div class="modal-macro-label">Kalorie</div></div>

                <div class="modal-macro"><div class="modal-macro-value">${displayMacros.fat}g</div><div class="modal-macro-label">Tluszcze</div></div>

        function closeModal(e) {
            if (!e || e.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');

        // ===========================================
        // ZAMIENNIKI SKŁADNIKÓW (SUBSTITUTES)
        // ===========================================
        let currentOpenSubstitutePopup = null;

        // Obsługa popupu z informacją o wartościach na 100g
        let currentOpenNutritionPopup = null;

        function toggleNutritionInfo(index, event) {
            event.stopPropagation();
            const popup = document.getElementById(`nutrition-info-${index}`);
            if (!popup) return;

            // Zamknij poprzedni popup
            if (currentOpenNutritionPopup !== null && currentOpenNutritionPopup !== index) {
                const prevPopup = document.getElementById(`nutrition-info-${currentOpenNutritionPopup}`);
                if (prevPopup) prevPopup.style.display = 'none';
            }

            if (popup.style.display === 'none' || popup.style.display === '') {
                popup.style.display = 'block';
                currentOpenNutritionPopup = index;
            } else {
                popup.style.display = 'none';
                currentOpenNutritionPopup = null;
            }
        }

        // Zastosuj optymalizację składników
        function applyOptimization() {
            const r = currentModalRecipe;
            if (!r || modalSelectedPersons.length === 0) return;
            if (!currentModalMealType) return;

            // Obsługa wielu osób - sumuj/uśredniaj cele
            let combinedTarget = { kcal: 0, protein: 0, fat: 0, carbs: 0 };
            let totalMultiplier = 0;

            for (const personId of modalSelectedPersons) {
                const person = persons.find(p => p.id === personId);
                if (!person) continue;

                const mealTarget = calculateMealTargets(person, currentModalMealType);
                if (!mealTarget) continue;

                combinedTarget.kcal += mealTarget.kcal * modalPortions;
                combinedTarget.protein += mealTarget.protein * modalPortions;
                combinedTarget.fat += mealTarget.fat * modalPortions;
                combinedTarget.carbs += mealTarget.carbs * modalPortions;

                totalMultiplier += person.portion * modalPortions;
            }

            // Zaokrąglij cele
            combinedTarget.kcal = Math.round(combinedTarget.kcal);
            combinedTarget.protein = Math.round(combinedTarget.protein);
            combinedTarget.fat = Math.round(combinedTarget.fat);
            combinedTarget.carbs = Math.round(combinedTarget.carbs);

            // Uruchom optymalizację
            const result = optimizeIngredients(r, combinedTarget, totalMultiplier);
            modalOptimizedIngredients = result;

            // Zapisz optymalizację dla wybranej osoby (jeśli z planera)
            if (currentPlanDay) {
                const personId = modalSelectedPersons[0];
                const key = getOptimizationKey(currentPlanDay, currentModalMealType, personId, r.id);

                mealOptimizations[key] = {
                    ...result,
                    nutrition: {
                        kcal: Math.round(result.nutrition.kcal),
                        protein: Math.round(result.nutrition.protein),
                        fat: Math.round(result.nutrition.fat),
                        carbs: Math.round(result.nutrition.carbs)
                    }
                };
                saveMealOptimizations();

                // Odśwież widok planera
                renderPlannerTable();
                renderKcalSummary();
            }

            // Aktualizuj widok składników z zoptymalizowanymi ilościami
            if (modalSelectedPersons.length > 1) {
                // Dla trybu "Razem" - użyj updateModalContent() która obsługuje zoptymalizowane składniki
                updateModalContent();
            } else {
                // Dla pojedynczej osoby - użyj dedykowanej funkcji z oznaczeniami zmian
                updateModalWithOptimizedIngredients(result);
            }
        }

        // Aktualizuj modal z zoptymalizowanymi składnikami
        function updateModalWithOptimizedIngredients(result) {
            const r = currentModalRecipe;
            if (!r) return;

            // Lista składników z wartościami odżywczymi (zoptymalizowane)
            const ingredientsHtml = result.ingredients.map((ing, index) => {

                const changedClass = ing.changed ? 'ingredient-changed' : '';
                const changeIndicator = ing.changed
                    ? `<span class="change-indicator" title="Zmieniono z ${originalAmount} ${ing.unit}">${ing.amount > ing.originalAmount ? '↑' : '↓'}</span>`

                const infoBtn = ingredient

                           ${ingredient.kcal} kcal | ${ingredient.protein}B | ${ingredient.fat}T | ${ingredient.carbs}W
                       </div>`
                    : '';

                const macrosHtml = !nutrition.missing
                    ? `<span class="ingredient-macros">${Math.round(nutrition.kcal)} | ${Math.round(nutrition.protein)}B | ${Math.round(nutrition.fat)}T | ${Math.round(nutrition.carbs)}W</span>`
                    : '';

                const substitutes = getIngredientSubstitutes(ing);
                const hasSubstitutes = substitutes.length > 0;
                const substituteBtn = `<button class="substitute-btn ${!hasSubstitutes ? 'no-substitutes' : ''}" onclick="toggleSubstitutePopup(${index}, event)" title="${hasSubstitutes ? 'Pokaż zamienniki' : 'Brak zamienników'}">↔</button>`;

                return `<li class="ingredient-item ${changedClass}">

            document.getElementById('modal-ingredients').innerHTML = ingredientsHtml;

            // Aktualizuj makra

                <div class="modal-macro"><div class="modal-macro-value">${result.nutrition.fat}g</div><div class="modal-macro-label">Tluszcze</div></div>
                <div class="modal-macro"><div class="modal-macro-value">${result.nutrition.carbs}g</div><div class="modal-macro-label">Wegle</div></div>`;

            // Aktualizuj sekcję optymalizacji z nowymi wartościami
            const person = persons.find(p => p.id === modalSelectedPersons[0]);
            const mealTarget = calculateMealTargets(person, currentModalMealType);
            const allocationPct = Math.round((person.mealAllocation?.[currentModalMealType] || 0.33) * 100);

            // Skaluj cele przez liczbę porcji
            const scaledTarget = {
                kcal: Math.round(mealTarget.kcal * modalPortions),
                protein: Math.round(mealTarget.protein * modalPortions),
                fat: Math.round(mealTarget.fat * modalPortions),
                carbs: Math.round(mealTarget.carbs * modalPortions)
            };

            const diff = {
                kcal: result.nutrition.kcal - scaledTarget.kcal,
                protein: result.nutrition.protein - scaledTarget.protein,
                fat: result.nutrition.fat - scaledTarget.fat,
                carbs: result.nutrition.carbs - scaledTarget.carbs
            };

            const formatDiff = (val) => val >= 0 ? `+${val}` : `${val}`;
            const getDiffColor = (val, threshold) => {
                const pct = Math.abs(val) / threshold * 100;
                if (pct <= 8) return '#22c55e';
                if (pct <= 15) return '#f59e0b';
                return '#ef4444';
            };

            const mealNamePl = { breakfast: 'Śniadanie', lunch: 'Obiad', dinner: 'Kolacja' };

            const optimizationSection = document.getElementById('modal-optimization');
            if (optimizationSection) {
                optimizationSection.innerHTML = `
                    <div class="optimization-header">
                        <span>🎯 Dopasowanie do celu (${mealNamePl[currentModalMealType]} - ${allocationPct}%)</span>
                        <span class="optimized-badge">✓ Zoptymalizowano</span>
                    </div>
                    <div class="optimization-grid">
                        <div class="opt-row opt-header-row">
                            <span></span>
                            <span>kcal</span>
                            <span>Białko</span>
                            <span>Tłuszcz</span>
                            <span>Węgle</span>
                        </div>
                        <div class="opt-row">
                            <span class="opt-label">Cel:</span>
                            <span>${scaledTarget.kcal}</span>
                            <span>${scaledTarget.protein}g</span>
                            <span>${scaledTarget.fat}g</span>
                            <span>${scaledTarget.carbs}g</span>
                        </div>
                        <div class="opt-row">
                            <span class="opt-label">Obecne:</span>
                            <span>${result.nutrition.kcal}</span>
                            <span>${result.nutrition.protein}g</span>
                            <span>${result.nutrition.fat}g</span>
                            <span>${result.nutrition.carbs}g</span>
                        </div>
                        <div class="opt-row opt-diff-row">
                            <span class="opt-label">Różnica:</span>
                            <span style="color: ${getDiffColor(diff.kcal, scaledTarget.kcal)}">${formatDiff(diff.kcal)}</span>
                            <span style="color: ${getDiffColor(diff.protein, scaledTarget.protein)}">${formatDiff(diff.protein)}</span>
                            <span style="color: ${getDiffColor(diff.fat, scaledTarget.fat)}">${formatDiff(diff.fat)}</span>
                            <span style="color: ${getDiffColor(diff.carbs, scaledTarget.carbs)}">${formatDiff(diff.carbs)}</span>
                        </div>
                    </div>
                    <button class="reset-optimization-btn" onclick="resetOptimization()">
                        ↩️ Przywróć oryginalne ilości
                    </button>
                `;
            }
        }

        // Przywróć oryginalne ilości składników
        function resetOptimization() {
            modalOptimizedIngredients = null;
            updateModalContent();
        }

        // Pokaż oryginalne składniki w trybie "Razem"
        function showOriginalRazem() {
            modalOptimizedIngredients = false; // false = pokaż oryginalne
            updateModalContent();
        }

        // Pokaż zoptymalizowane składniki w trybie "Razem"
        function showOptimizedRazem() {
            modalOptimizedIngredients = null; // null = domyślnie zoptymalizowane w trybie Razem
            updateModalContent();
        }

        function toggleSubstitutePopup(ingredientIndex, event) {
            event.stopPropagation();
            openSubstituteModal(ingredientIndex);
        }

        function openSubstituteModal(ingredientIndex) {
            const r = currentModalRecipe;
            if (!r) {
                console.error('Brak currentModalRecipe');
                return;
            }

            // Użyj zoptymalizowanych składników jeśli dostępne, w przeciwnym razie oryginalne
            // modalOptimizedIngredients to obiekt { ingredients: [...], nutrition: {...} }
            const ingredients = modalOptimizedIngredients ? modalOptimizedIngredients.ingredients : r.ingredients;
            if (!ingredients || !ingredients[ingredientIndex]) {
                console.error('Brak składnika o indeksie:', ingredientIndex, 'ingredients:', ingredients);
                return;
            }

            const ingredient = ingredients[ingredientIndex];

            // Oblicz multiplier dla składników
            let multiplier = 0;
            const person = persons.find(p => p.id === modalSelectedPersons[0]);
            if (person) multiplier = person.portion;
            multiplier *= modalPortions;

            // Oblicz aktualną ilość składnika (po optymalizacji lub z multiplierem)
            const currentAmount = modalOptimizedIngredients
                ? ingredient.amount  // Zoptymalizowane już mają prawidłową ilość
                : ingredient.amount * multiplier;  // Oryginalne trzeba przemnożyć

            // Pobierz zamienniki na podstawie nazwy składnika
            const centralSubs = ingredientSubstitutes[ingredient.item];

            const overlay = document.getElementById('substitute-modal-overlay');
            const content = document.getElementById('substitute-modal-content');
            if (!overlay || !content) {
                console.error('Brak elementów modalu zamienników');
                return;
            }

            let bodyHtml = '';

            // Jeśli brak zamienników - pokaż komunikat
            if (!centralSubs || centralSubs.length === 0) {
                bodyHtml = `
                    <div class="no-substitutes-message">
                        Brak zdefiniowanych zamienników dla tego składnika.
                    </div>
                `;
            } else {
                // Oblicz zamienniki na podstawie aktualnej ilości składnika
                const substituteItems = centralSubs.map(sub => {
                    const scaledAmount = Math.round(currentAmount * sub.ratio * 10) / 10;
                    return `
                        <li class="substitute-item">
                            <span class="substitute-icon">↔</span>
                            <span class="substitute-name">${sub.item}</span>
                            <span class="substitute-amount">${scaledAmount} ${ingredient.unit}</span>
                        </li>
                    `;
                }).join('');

                bodyHtml = `
                    <ul class="substitute-list">
                        ${substituteItems}
                    </ul>
                `;
            }

            content.innerHTML = `
                <div class="substitute-header">
                    <div>
                        <div class="substitute-header-title">Zamienniki</div>
                        <div class="substitute-header-ingredient">${ingredient.item} (${Math.round(currentAmount * 10) / 10} ${ingredient.unit})</div>
                    </div>
                    <button class="substitute-close" onclick="closeSubstituteModal()">×</button>
                </div>
                <div class="substitute-body">
                    ${bodyHtml}
                </div>
            `;

            overlay.classList.add('active');
        }

        function closeSubstituteModal(event) {
            // Jeśli kliknięto na content - nie zamykaj
            if (event && event.target.id !== 'substitute-modal-overlay') {
                return;
            }
            const overlay = document.getElementById('substitute-modal-overlay');
            if (overlay) {
                overlay.classList.remove('active');
            }
        }

        function closeSubstitutePopup() {
            closeSubstituteModal();
        }

        function closeAllSubstitutePopups() {
            closeSubstituteModal();
        }

        // FILTRY LISTY ZAKUPÓW
        let shoppingListSelection = {
            days: [...days],
            mealTypes: [...mealTypes]
        };

        function loadShoppingSelection() {
            const saved = localStorage.getItem('shoppingListSelection');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    shoppingListSelection.days = parsed.days || [...days];
                    shoppingListSelection.mealTypes = parsed.mealTypes || [...mealTypes];
                } catch(e) {}
            }
        }

        function saveShoppingSelection() {
            localStorage.setItem('shoppingListSelection', JSON.stringify(shoppingListSelection));
        }

        // ODHACZONE PRODUKTY NA LIŚCIE ZAKUPÓW
        let checkedShoppingItems = new Set();

        function loadCheckedItems() {
            const saved = localStorage.getItem('checkedShoppingItems');
            if (saved) {
                try {
                    checkedShoppingItems = new Set(JSON.parse(saved));
                } catch(e) {}
            }
        }

        function saveCheckedItems() {
            localStorage.setItem('checkedShoppingItems', JSON.stringify([...checkedShoppingItems]));
        }

        function toggleShoppingItem(item, checked) {
            if (checked) {
                checkedShoppingItems.add(item);
            } else {
                checkedShoppingItems.delete(item);
            }
            saveCheckedItems();
        }

        function clearCheckedItems() {
            checkedShoppingItems.clear();
            saveCheckedItems();
            renderShoppingList();
        }

        function renderShoppingDaysFilter() {
            const container = document.getElementById('shopping-days');
            if (!container) return;
            container.innerHTML = days.map(day => {
                const isSelected = shoppingListSelection.days.includes(day);
                const shortName = day.substring(0, 3);
                return `
                    <div class="shopping-day-checkbox ${isSelected ? 'selected' : ''}"
                         onclick="toggleShoppingDay('${day}')">
                        <span class="shopping-day-name">${shortName}</span>
                    </div>
                `;
            }).join('');
            updateShoppingSummary();
            updateMealCheckboxes();
        }

        function updateMealCheckboxes() {
            const breakfastCb = document.getElementById('meal-breakfast');
            const lunchCb = document.getElementById('meal-lunch');
            const dinnerCb = document.getElementById('meal-dinner');
            if (breakfastCb) breakfastCb.checked = shoppingListSelection.mealTypes.includes('breakfast');
            if (lunchCb) lunchCb.checked = shoppingListSelection.mealTypes.includes('lunch');
            if (dinnerCb) dinnerCb.checked = shoppingListSelection.mealTypes.includes('dinner');
        }

        function toggleShoppingDay(day) {
            const idx = shoppingListSelection.days.indexOf(day);
            if (idx > -1) {
                shoppingListSelection.days.splice(idx, 1);
            } else {
                shoppingListSelection.days.push(day);
            }
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function toggleShoppingMealType(mealType) {
            const idx = shoppingListSelection.mealTypes.indexOf(mealType);
            if (idx > -1) {
                shoppingListSelection.mealTypes.splice(idx, 1);
            } else {
                shoppingListSelection.mealTypes.push(mealType);
            }
            updateShoppingSummary();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectAllDays() {
            shoppingListSelection.days = [...days];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function deselectAllDays() {
            shoppingListSelection.days = [];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectWeekdays() {
            shoppingListSelection.days = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek'];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function selectWeekend() {
            shoppingListSelection.days = ['Sobota', 'Niedziela'];
            renderShoppingDaysFilter();
            renderShoppingList();
            saveShoppingSelection();
        }

        function updateShoppingSummary() {
            const numDays = shoppingListSelection.days.length;
            const numMealTypes = shoppingListSelection.mealTypes.length;
            const numPersons = persons.length;
            const total = numDays * numMealTypes * numPersons;

            const summary = document.getElementById('shopping-summary');
            if (summary) {
                if (total === 0) {
                    summary.innerHTML = '⚠️ Nie wybrano żadnych posiłków';
                } else {
                    summary.innerHTML = `🛒 Wybrano: <strong>${total}</strong> posiłków (${numDays} dni × ${numMealTypes} posiłki × ${numPersons} osoby)`;
                }
            }
        }

        // MNOŻNIK LISTY ZAKUPÓW
        function setShoppingMultiplier(value) {
            shoppingListMultiplier = value;
            renderShoppingMultiplierButtons();
            renderShoppingList();
        }

        function renderShoppingMultiplierButtons() {
            const container = document.getElementById('shopping-multiplier-container');
            if (!container) return;

            const buttons = container.querySelectorAll('.multiplier-btn');
            buttons.forEach(btn => {
                const val = parseInt(btn.textContent.replace('x', ''));
                btn.classList.toggle('active', val === shoppingListMultiplier);
            });

            const info = document.getElementById('multiplier-info');
            if (info) {
                if (shoppingListMultiplier > 1) {
                    info.textContent = `(np. na ${shoppingListMultiplier} tygodnie)`;
                } else {
                    info.textContent = '';
                }
            }
        }

        // LISTA ZAKUPÓW - z uwzględnieniem mnożników porcji i filtrów
        function renderShoppingList() {
            const list = {};
            let total = 0;

            // Używamy filtrowanych dni i typów posiłków
            shoppingListSelection.days.forEach(day => {
                shoppingListSelection.mealTypes.forEach(mt => {
                    const meal = plan[day]?.[mt];
                    if (!meal) return;
                    // Osobne receptury dla każdej osoby
                    persons.forEach(person => {
                        const recipeId = meal[person.id];
                        if (recipeId) {
                            total++;
                            const r = recipes[mt].find(x => x.id === recipeId);
                            if (r) {
                                // Sprawdź czy jest optymalizacja dla tego przepisu/osoby/dnia
                                const optKey = getOptimizationKey(day, mt, person.id, recipeId);
                                const optimization = mealOptimizations[optKey];
                                const ingredients = optimization ? optimization.ingredients : r.ingredients;

                                ingredients.forEach(ing => {
                                    const k = `${ing.item} (${ing.unit})`;
                                    // Przy optymalizacji ilość jest już przeliczona (uwzględnia porcje)
                                    const amount = optimization
                                        ? ing.amount * shoppingListMultiplier
                                        : ing.amount * person.portion * shoppingListMultiplier;
                                    list[k] = (list[k] || 0) + amount;
                                });
                            }
                        }
                    });
                });
            });

            Object.keys(list).forEach(k => list[k] = Math.ceil(list[k] * 10) / 10);

            // Pokaż info o osobach i mnożniku
            const personsInfo = persons.map(p => `${p.name} (${p.portion}x)`).join(' + ');
            const multiplierText = shoppingListMultiplier > 1 ? ` (×${shoppingListMultiplier})` : '';
            document.getElementById('shopping-info').textContent = total > 0
                ? `${total} posiłków dla: ${personsInfo}${multiplierText}`
                : '';

            const container = document.getElementById('shopping-list');
            container.innerHTML = '';

            if (Object.keys(list).length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px;">Najpierw zaplanuj posiłki</p>';
                return;
            }

            const categorizedItems = new Set();

            categories.forEach(cat => {
                const items = Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw)));
                if (items.length === 0) return;

                items.forEach(([item]) => categorizedItems.add(item));

                const div = document.createElement('div');
                div.className = 'category';
                div.innerHTML = `<h3>${cat.name}</h3>`;
                items.forEach(([item, amt]) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    const isChecked = checkedShoppingItems.has(item);
                    const escapedItem = item.replace(/'/g, "\\'");
                    itemDiv.innerHTML = `
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleShoppingItem('${escapedItem}', this.checked); this.nextElementSibling.classList.toggle('checked', this.checked)">
                        <span class="item-name ${isChecked ? 'checked' : ''}">${item}</span>
                        <span class="item-amount">${amt}</span>`;
                    div.appendChild(itemDiv);
                });
                container.appendChild(div);
            });

            // Catch-all: składniki które nie trafiły do żadnej kategorii
            const uncategorized = Object.entries(list).filter(([item]) => !categorizedItems.has(item));
            if (uncategorized.length > 0) {
                const div = document.createElement('div');
                div.className = 'category';
                div.innerHTML = `<h3>📦 POZOSTAŁE</h3>`;
                uncategorized.forEach(([item, amt]) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    const isChecked = checkedShoppingItems.has(item);
                    const escapedItem = item.replace(/'/g, "\\'");
                    itemDiv.innerHTML = `
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleShoppingItem('${escapedItem}', this.checked); this.nextElementSibling.classList.toggle('checked', this.checked)">
                        <span class="item-name ${isChecked ? 'checked' : ''}">${item}</span>
                        <span class="item-amount">${amt}</span>`;
                    div.appendChild(itemDiv);
                });
                container.appendChild(div);
            }
        }

        function copyShoppingList() {
            const list = {};
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    const meal = plan[day][mt];
                    // Osobne receptury dla każdej osoby
                    persons.forEach(person => {
                        const recipeId = meal[person.id];
                        if (recipeId) {
                            const r = recipes[mt].find(x => x.id === recipeId);
                            if (r) {
                                // Sprawdź czy jest optymalizacja dla tego przepisu/osoby/dnia
                                const optKey = getOptimizationKey(day, mt, person.id, recipeId);
                                const optimization = mealOptimizations[optKey];
                                const ingredients = optimization ? optimization.ingredients : r.ingredients;

                                ingredients.forEach(ing => {
                                    const k = `${ing.item} (${ing.unit})`;
                                    // Przy optymalizacji ilość jest już przeliczona (uwzględnia porcje)
                                    const amount = optimization
                                        ? ing.amount * shoppingListMultiplier
                                        : ing.amount * person.portion * shoppingListMultiplier;
                                    list[k] = (list[k] || 0) + amount;
                                });
                            }
                        }
                    });
                });
            });
            Object.keys(list).forEach(k => list[k] = Math.ceil(list[k] * 10) / 10);

            const personsInfo = persons.map(p => `${p.name} (${p.portion}x)`).join(' + ');
            const multiplierText = shoppingListMultiplier > 1 ? ` [×${shoppingListMultiplier}]` : '';
            let txt = `🛒 LISTA ZAKUPÓW${multiplierText}\nDla: ${personsInfo}\n\n`;
            let hasItems = false;
            const copyCategorized = new Set();
            categories.forEach(cat => {
                const items = Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw)) && !checkedShoppingItems.has(item));
                Object.entries(list).filter(([item]) =>
                    cat.keywords.some(kw => item.toLowerCase().includes(kw))).forEach(([item]) => copyCategorized.add(item));
                if (items.length === 0) return;
                hasItems = true;
                txt += cat.name + "\n";
                items.forEach(([item, amt]) => txt += `☐ ${item}: ${amt}\n`);
                txt += "\n";
            });

            const copyUncategorized = Object.entries(list).filter(([item]) => !copyCategorized.has(item) && !checkedShoppingItems.has(item));
            if (copyUncategorized.length > 0) {
                hasItems = true;
                txt += "📦 POZOSTAŁE\n";
                copyUncategorized.forEach(([item, amt]) => txt += `☐ ${item}: ${amt}\n`);
                txt += "\n";
            }

            if (!hasItems) {
                alert('Wszystkie produkty zostały odhaczone! Nie ma nic do skopiowania.');
                return;
            }

            navigator.clipboard.writeText(txt).then(() => alert('Lista skopiowana do schowka!\n\n(Odhaczone produkty zostały pominięte)'));
        }

                    });
                });
            } else {
                navigator.clipboard.writeText(txt).then(() => {
                    alert('Lista skopiowana do schowka!\nWyślij przez SMS lub komunikator.');

        // ZAPIS/ODCZYT
        function savePlan() {
            localStorage.setItem('mealPlanV5', JSON.stringify(plan));
        }

        function savePersons() {
            localStorage.setItem('mealPersons', JSON.stringify(persons));
        }

        function loadPersons() {
            const saved = localStorage.getItem('mealPersons');
            if (saved) {
                try {
                    persons = JSON.parse(saved);
                } catch(e) {}
            }
        }

        // ===========================================
        // FUNKCJE - DODAWANIE/USUWANIE OSÓB
        // ===========================================

        function addPerson() {
            if (persons.length >= MAX_PERSONS) {
                alert('Maksymalna liczba osób to ' + MAX_PERSONS);
                return;
            }

            const newId = Math.max(...persons.map(p => p.id), 0) + 1;
            const newPerson = {
                id: newId,
                name: `Osoba ${newId}`,
                color: PERSON_COLORS[persons.length % PERSON_COLORS.length],
                gender: 'male',
                age: 30,
                height: 175,
                weight: 75,
                activity: 'moderate',
                goal: 'maintain',
                tdee: 2500,
                targetKcal: 2420,
                portion: 1.0,
                targetProtein: 166,
                targetFat: 82,
                targetCarbs: 238,
                mealAllocation: { breakfast: 0.25, lunch: 0.40, dinner: 0.35 }
            };

            recalculatePerson(newPerson);
            persons.push(newPerson);

            // Rozszerz plan o nową osobę
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    if (plan[day] && plan[day][mt]) {
                        plan[day][mt][newId] = null;
                    }
                });
            });

            // Rozszerz eatenMeals
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    if (!eatenMeals[day]) eatenMeals[day] = {};
                    if (!eatenMeals[day][mt]) eatenMeals[day][mt] = {};
                    eatenMeals[day][mt][newId] = false;
                });
            });

            savePersons();
            savePlan();
            saveEatenMeals();
            refreshAllViews();
        }

        function removePerson(personId) {
            if (persons.length <= MIN_PERSONS) {
                alert('Musi być co najmniej ' + MIN_PERSONS + ' osoba');
                return;
            }

            const personToRemove = persons.find(p => p.id === personId);
            if (!personToRemove) return;

            if (!confirm(`Czy na pewno usunąć osobę "${personToRemove.name}"? Przepisy przypisane do tej osoby zostaną usunięte.`)) {
                return;
            }

            persons = persons.filter(p => p.id !== personId);

            // Usuń z planu
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    if (plan[day] && plan[day][mt]) {
                        delete plan[day][mt][personId];
                    }
                });
            });

            // Usuń z eatenMeals
            days.forEach(day => {
                mealTypes.forEach(mt => {
                    if (eatenMeals[day] && eatenMeals[day][mt]) {
                        delete eatenMeals[day][mt][personId];
                    }
                });
            });

            savePersons();
            savePlan();
            saveEatenMeals();
            refreshAllViews();
        }

        function refreshAllViews() {
            renderSettingsPanel();
            renderPersonsPanel();
            updateTableHeaders();
            renderPlannerTable();
            renderKcalSummary();
            renderShoppingList();
        }

        // Migracja starych danych do nowej struktury V5+ (osobne receptury per osoba, dynamiczna liczba osób)
        function migratePlan(oldPlan) {
            const newPlan = {};
            days.forEach(day => {
                newPlan[day] = {};
                mealTypes.forEach(mt => {
                    const oldValue = oldPlan[day] ? oldPlan[day][mt] : null;

                    // Inicjalizuj wszystkie osoby jako null
                    newPlan[day][mt] = {};
                    persons.forEach(p => {
                        newPlan[day][mt][p.id] = null;
                    });

                    // V5+ format: { 1: 'recipeId', 2: 'recipeId', ... }
                    if (oldValue && typeof oldValue === 'object' && (oldValue[1] !== undefined || oldValue[2] !== undefined)) {
                        Object.keys(oldValue).forEach(key => {
                            const personId = parseInt(key);
                            if (persons.find(p => p.id === personId)) {
                                newPlan[day][mt][personId] = oldValue[key];
                            }
                        });
                    }
                    // V4 format: { recipe: 'id', persons: [1,2] }
                    else if (oldValue && typeof oldValue === 'object' && oldValue.recipe !== undefined) {
                        if (oldValue.persons) {
                            oldValue.persons.forEach(pid => {
                                if (persons.find(p => p.id === pid)) {
                                    newPlan[day][mt][pid] = oldValue.recipe;
                                }
                            });
                        }
                    }
                    // V3 format: string recipe ID
                    else if (oldValue && typeof oldValue === 'string') {
                        persons.forEach(p => {
                            newPlan[day][mt][p.id] = oldValue;
                        });
                    }
                });
            });
            return newPlan;
        }

        function loadPlan() {
            // Sprawdź URL
            const params = new URLSearchParams(window.location.search);
            const urlPlan = params.get('plan');
            if (urlPlan) {
                try {
                    const loadedPlan = JSON.parse(decodeURIComponent(atob(urlPlan)));
                    plan = migratePlan(loadedPlan);
                    document.getElementById('loaded-alert').style.display = 'flex';
                    window.history.replaceState({}, '', window.location.pathname);
                    savePlan();
                    return;
                } catch(e) {}
            }

            // Sprawdź localStorage - nowy format V5
            let saved = localStorage.getItem('mealPlanV5');
            if (saved) {
                try {
                    plan = JSON.parse(saved);
                    return;
                } catch(e) {}
            }

            // Migracja z V4
            saved = localStorage.getItem('mealPlanV4');
            if (saved) {
                try {
                    const oldPlan = JSON.parse(saved);
                    plan = migratePlan(oldPlan);
                    savePlan();
                    return;
                } catch(e) {}
            }

            // Migracja ze starego formatu V3
            saved = localStorage.getItem('mealPlanV3');
            if (saved) {
                try {
                    const oldPlan = JSON.parse(saved);
                    plan = migratePlan(oldPlan);
                    savePlan();
                } catch(e) {}
            }
        }

        function hideLoadedAlert() {
            document.getElementById('loaded-alert').style.display = 'none';
            savePlan();
        }

        // Udostępnianie planu przez link
        function sharePlan() {
            try {
                const planData = btoa(encodeURIComponent(JSON.stringify(plan)));
                const shareUrl = window.location.origin + window.location.pathname + '?plan=' + planData;

                if (navigator.share) {
                    // Natywne udostępnianie (iOS/Android)
                    navigator.share({
                        title: 'Mój jadłospis',
                        text: 'Sprawdź mój plan posiłków na tydzień!',
                        url: shareUrl
                    }).catch(() => {
                        // Użytkownik anulował - kopiuj do schowka jako fallback
                        copyToClipboard(shareUrl);
                    });
                } else {
                    // Brak natywnego udostępniania - kopiuj do schowka
                    copyToClipboard(shareUrl);
                }
            } catch(e) {
                alert('Błąd podczas generowania linku. Spróbuj ponownie.');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Link skopiowany do schowka!\n\nWyślij go przez SMS, WhatsApp lub inny komunikator.');
            }).catch(() => {
                // Fallback dla starszych przeglądarek
                prompt('Skopiuj ten link:', text);
            });
        }

        // INIT
        loadPersons();
        loadPlan();
        loadEatenMeals();
        loadFavorites();
        loadMealOptimizations();
        loadShoppingSelection();
        loadCheckedItems();
        // Przelicz TDEE dla załadowanych osób
        persons.forEach(p => recalculatePerson(p));
        renderSettingsPanel();
        renderPersonsPanel();
        updateTableHeaders();
        renderVariantButtons(); // Generuj przyciski wariantów dynamicznie
        renderPlannerTable();
        renderRecipesPersonSelector();
        renderRecipes();
    </script>

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }
    </script>
